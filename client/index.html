<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Join our waitlist to be the first to know when we launch" />
    <title>Waitlist App - Join Our Exclusive Waitlist</title>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection during build -->
    <!-- This must be in static HTML for Netlify to detect it -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
